name: Premove lock debug

on: [push]

permissions:
  contents: read

jobs:
  lock-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: git diff -- package.json pnpm-lock.yaml
