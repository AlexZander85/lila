name: Refresh multiple-premoves lockfile

on:
  push:
    branches:
      - agent/multiple-premoves-web-manual-test
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/refresh-multiple-premoves-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/multiple-premoves-web-manual-test
      - uses: pnpm/action-setup@v5
        with:
          version: 11.18.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Refresh lockfile for exact web validation"
          git push
